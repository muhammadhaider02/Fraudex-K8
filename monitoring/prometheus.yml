global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # ── System metrics via node_exporter ──────────────
  - job_name: "node"
    static_configs:
      - targets: ["localhost:9100"]

  # ── Inference API metrics ──────────────────────────
  - job_name: "fraudex-inference"
    static_configs:
      - targets: ["localhost:8000"]
    metrics_path: "/metrics"

  # ── Prometheus self-monitoring ─────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── KFP pipeline metrics ───────────────────────────
  - job_name: "kubeflow-pipelines"
    static_configs:
      - targets: ["localhost:8888"]
    metrics_path: "/metrics"
    